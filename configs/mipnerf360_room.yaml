# Mip-NeRF 360 "room" (indoor). Download first:
#   python scripts/download_mipnerf360.py --scene room --resolution 4
scene_dir: data/mipnerf360/room
output_dir: outputs/room

sparse:
  camera_model: SIMPLE_RADIAL
  holdout_every: 8          # every 8th image is a test view for 6DoF pose evaluation

dense:
  method: sgbm              # "colmap" if you have a CUDA build of COLMAP on PATH
  max_image_size: 1000

detection:
  model: yolo11m-seg.pt
  confidence: 0.35

fusion:
  min_views: 3
  min_points: 15
